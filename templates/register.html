{% extends "base.html" %}

{% block title %}注册 - 图书馆管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 mt-5">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus text-primary" style="font-size: 3rem;"></i>
                    <h3 class="mt-2">用户注册</h3>
                    <p class="text-muted small">创建您的读者账号</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">用户名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="username" required
                               minlength="3" maxlength="20" placeholder="3-20个字符"
                               value="{{ request.form.username }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">邮箱 <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" name="email" required
                               placeholder="your@email.com"
                               value="{{ request.form.email }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">手机号</label>
                        <input type="text" class="form-control" name="phone"
                               placeholder="选填" value="{{ request.form.phone }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="password" required
                               minlength="8" placeholder="至少8位，含大小写字母和数字">
                        <div class="form-text">
                            密码要求：至少8位，包含大写字母、小写字母和数字
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="confirm" required
                               placeholder="再次输入密码">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-person-plus"></i> 注册
                        </button>
                    </div>
                </form>

                <hr class="my-4">
                <div class="text-center">
                    <span class="text-muted">已有账号？</span>
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none">返回登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
