{% extends "base.html" %}

{% block title %}反馈与荐购 - 图书馆管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{{ url_for('feedback.feedback_list') }}">我的反馈</a></li>
                <li class="breadcrumb-item active">提交反馈</li>
            </ol>
        </nav>

        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-chat-dots"></i> 反馈与荐购</h5>
            </div>
            <div class="card-body">
                <p class="text-muted small mb-4">
                    <i class="bi bi-info-circle"></i>
                    欢迎提出您的意见建议或荐购图书，我们会认真处理每一条反馈。
                </p>

                <form method="POST" action="{{ url_for('feedback.feedback_new') }}" id="feedbackForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <!-- 反馈类型 -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">反馈类型 <span class="text-danger">*</span></label>
                        <div class="row g-2">
                            <div class="col-6 col-md-3">
                                <div class="form-check card-radio">
                                    <input class="form-check-input" type="radio" name="feedback_type"
                                           id="typeSuggestion" value="suggestion" checked>
                                    <label class="form-check-label w-100" for="typeSuggestion">
                                        <i class="bi bi-lightbulb text-warning"></i> 功能建议
                                    </label>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="form-check card-radio">
                                    <input class="form-check-input" type="radio" name="feedback_type"
                                           id="typeBookRequest" value="book_request">
                                    <label class="form-check-label w-100" for="typeBookRequest">
                                        <i class="bi bi-bookmark-plus text-primary"></i> 图书荐购
                                    </label>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="form-check card-radio">
                                    <input class="form-check-input" type="radio" name="feedback_type"
                                           id="typeBugReport" value="bug_report">
                                    <label class="form-check-label w-100" for="typeBugReport">
                                        <i class="bi bi-bug text-danger"></i> 问题报告
                                    </label>
                                </div>
                            </div>
                            <div class="col-6 col-md-3">
                                <div class="form-check card-radio">
                                    <input class="form-check-input" type="radio" name="feedback_type"
                                           id="typeComplaint" value="complaint">
                                    <label class="form-check-label w-100" for="typeComplaint">
                                        <i class="bi bi-exclamation-octagon text-secondary"></i> 投诉
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 荐购图书信息（仅图书荐购时显示） -->
                    <div id="bookFields" style="display:none;">
                        <div class="card bg-light border-0 mb-4">
                            <div class="card-body">
                                <h6 class="card-title mb-3">
                                    <i class="bi bi-bookmark-plus text-primary"></i> 荐购图书信息
                                </h6>
                                <div class="row g-3">
                                    <div class="col-md-8">
                                        <label class="form-label">书名 <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" name="book_title"
                                               placeholder="请输入荐购书名">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">作者</label>
                                        <input type="text" class="form-control" name="book_author"
                                               placeholder="作者">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">ISBN</label>
                                        <input type="text" class="form-control" name="book_isbn"
                                               placeholder="如 9787xxxxxxx">
                                    </div>
                                    <div class="col-md-5">
                                        <label class="form-label">出版社</label>
                                        <input type="text" class="form-control" name="book_publisher"
                                               placeholder="出版社名称">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label">价格（元）</label>
                                        <input type="number" step="0.01" min="0" class="form-control"
                                               name="book_price" placeholder="0.00">
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label">分类建议</label>
                                        <input type="text" class="form-control" name="book_category"
                                               list="categoryList" placeholder="可从已有分类选择或自行输入">
                                        <datalist id="categoryList">
                                            {% for cat in categories %}
                                            <option value="{{ cat.name }}">
                                            {% endfor %}
                                        </datalist>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 标题 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">标题 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="title" required
                               placeholder="请简要概括您的反馈内容" maxlength="200">
                    </div>

                    <!-- 详细内容 -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">详细内容 <span class="text-danger">*</span></label>
                        <textarea class="form-control" name="content" rows="6" required
                                  placeholder="请详细描述您的意见建议、遇到的问题或荐购理由……"></textarea>
                    </div>

                    <!-- 提交按钮 -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send"></i> 提交反馈
                        </button>
                        <a href="{{ url_for('feedback.feedback_list') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 根据反馈类型控制荐购字段显示/隐藏
(function () {
    var bookFields = document.getElementById('bookFields');
    var radios = document.querySelectorAll('input[name="feedback_type"]');

    function toggleBookFields() {
        var selected = document.querySelector('input[name="feedback_type"]:checked');
        if (selected && selected.value === 'book_request') {
            bookFields.style.display = '';
            // 荐购时书名为必填
            var bookTitle = bookFields.querySelector('input[name="book_title"]');
            if (bookTitle) bookTitle.setAttribute('required', 'required');
        } else {
            bookFields.style.display = 'none';
            var bookTitle = bookFields.querySelector('input[name="book_title"]');
            if (bookTitle) bookTitle.removeAttribute('required');
        }
    }

    radios.forEach(function (radio) {
        radio.addEventListener('change', toggleBookFields);
    });

    // 初始化
    toggleBookFields();
})();
</script>
{% endblock %}
