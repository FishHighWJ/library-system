{% extends "base.html" %}

{% block title %}登录 - 图书馆管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0 mt-5">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-book-half text-primary" style="font-size: 3rem;"></i>
                    <h3 class="mt-2">欢迎登录</h3>
                    <p class="text-muted small">图书馆图书管理系统</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" name="username" required
                                   placeholder="请输入用户名" autofocus>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" name="password" required
                                   placeholder="请输入密码">
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right"></i> 登录
                        </button>
                    </div>
                </form>

                <hr class="my-4">
                <div class="text-center">
                    <span class="text-muted">还没有账号？</span>
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none">立即注册</a>
                </div>

                <!-- 测试账号提示 -->
                <div class="alert alert-info mt-3 mb-0 small">
                    <p class="mb-0"><strong>测试账号：</strong>用户名 <code>admin</code>（管理员）/ <code>reader</code>（读者）</p>
                    <p class="mb-0">密码请查看 <code>.env.example</code> 中的 <code>ADMIN_PASSWORD</code> / <code>READER_PASSWORD</code></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
