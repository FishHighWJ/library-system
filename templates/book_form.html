{% extends "base.html" %}

{% block title %}{{ '编辑图书' if book else '添加图书' }} - 图书馆管理系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0">
                    <i class="bi bi-{{ 'pencil' if book else 'plus-circle' }}"></i>
                    {{ '编辑图书信息' if book else '添加新图书' }}
                </h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('books.edit_book', book_id=book.id) if book else url_for('books.add_book') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">书名 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="title" required
                                   value="{{ book.title if book else '' }}" placeholder="请输入书名">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">作者 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="author" required
                                   value="{{ book.author if book else '' }}" placeholder="请输入作者">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">ISBN</label>
                            <input type="text" class="form-control" name="isbn"
                                   value="{{ book.isbn if book else '' }}" placeholder="9787xxxxxxx">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">出版社</label>
                            <input type="text" class="form-control" name="publisher"
                                   value="{{ book.publisher if book else '' }}" placeholder="出版社名称">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">价格（元）</label>
                            <input type="number" step="0.01" min="0" class="form-control" name="price"
                                   value="{{ book.price if book else 0 }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">馆藏数量 <span class="text-danger">*</span></label>
                            <input type="number" min="1" class="form-control" name="total_count" required
                                   value="{{ book.total_count if book else 1 }}">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">分类</label>
                            <select class="form-select" name="category_id">
                                <option value="">请选择分类</option>
                                {% for cat in categories %}
                                <option value="{{ cat.id }}"
                                    {{ 'selected' if book and book.category_id == cat.id }}>
                                    {{ cat.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">馆藏位置</label>
                        <input type="text" class="form-control" name="location"
                               value="{{ book.location if book else '' }}" placeholder="如：A-01-001">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">内容简介</label>
                        <textarea class="form-control" name="description" rows="4"
                                  placeholder="请输入图书简介...">{{ book.description if book else '' }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i>
                            {{ '保存修改' if book else '添加图书' }}
                        </button>
                        <a href="{{ url_for('books.book_detail', book_id=book.id) if book else url_for('books.index') }}"
                           class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> 取消
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
