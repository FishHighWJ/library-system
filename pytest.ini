[pytest]
# 测试发现规则
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 覆盖率配置
# --cov=.         统计项目所有 .py 文件
# --cov-report=term-missing  终端输出未覆盖行
# --cov-report=html          生成 htmlcov/ 目录便于查看
# --cov-fail-under=70        覆盖率低于 70% 时测试失败（CI 强制保障质量）
# --no-cov-on-fail           测试失败时不统计覆盖率，加速
addopts = -v --cov=. --cov-report=term-missing --cov-report=html --cov-fail-under=70 --no-cov-on-fail

# 测试路径
testpaths = tests

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
